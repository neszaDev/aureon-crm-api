# The only CI workflow. Each job runs the same command a developer runs locally:
#   verify      -> make verify  (./mvnw verify: Spotless, -Werror compile, unit + integration tests)
#   image-smoke -> make smoke   (runtime image started with the prod profile)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runtime -t spring-postgres-boilerplate:${{ github.sha }} .
      - run: scripts/smoke-test.sh spring-postgres-boilerplate:${{ github.sha }}
      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-app-log
          path: target/smoke-app.log
          retention-days: 14
