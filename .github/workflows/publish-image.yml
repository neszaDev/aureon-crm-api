# Reusable: build the runtime image and push it to GitHub Container Registry.
# Called only by cd-dev.yml and cd-main.yml, after CI has passed for the same commit.
name: Publish image

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment (dev or main); protection rules apply here
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # dev branch -> :dev   main -> :main, :latest   tag v1.2.3 -> :1.2.3, :1.2   always :sha-<short>
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
