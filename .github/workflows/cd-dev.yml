# Every push to dev: run CI, then publish ghcr.io/<repo>:dev (+ :sha-<short>).
name: CI/CD - dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    uses: ./.github/workflows/publish-image.yml
    with:
      environment: dev
    permissions:
      contents: read
      packages: write
      id-token: write
