# Weekly, grouped updates to avoid a pile of one-line PRs. Minor/patch bumps are grouped per
# ecosystem; major bumps (e.g. Spring Boot 4) arrive as separate PRs and need a deliberate review.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      docker-images:
        patterns: ["*"]
