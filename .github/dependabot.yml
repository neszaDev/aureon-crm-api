# Weekly, grouped updates to avoid a pile of one-line PRs. Minor/patch bumps are grouped per
# ecosystem and target dev (they reach main with the next release); major bumps (e.g. Spring Boot 4) arrive as separate PRs and need a deliberate review.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    commit-message: { prefix: ci }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    target-branch: dev
    commit-message: { prefix: build, include: scope }
    groups:
      docker-images:
        update-types: [minor, patch]
    # The JDK/JRE major is a project decision (pom.xml <java.version>), never a routine bump.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
