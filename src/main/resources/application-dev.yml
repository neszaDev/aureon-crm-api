spring:
  config.activate.on-profile: dev
  jpa.properties.hibernate.format_sql: true
logging.level:
  com.example.boilerplate: DEBUG
  org.hibernate.SQL: DEBUG
app.security.jwt.secret: ${JWT_SECRET:development-only-change-this-secret-to-at-least-32-bytes}
app.demo:
  # DEMO_DATA=true seeds the demo workspace once (docs/crm/README.md, Try it).
  enabled: ${DEMO_DATA:false}
  password: ${DEMO_PASSWORD:demo-password}
