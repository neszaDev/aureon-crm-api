spring:
  config.activate.on-profile: prod
  datasource:
    # Deliberately no defaults: production must provide all three variables.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa.show-sql: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: never
logging.level.root: INFO
# The API docs and Swagger UI are off in prod; SPRINGDOC_ENABLED=true turns both on.
springdoc:
  api-docs.enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui.enabled: ${SPRINGDOC_ENABLED:false}
app:
  security.jwt.secret: ${JWT_SECRET}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS}
