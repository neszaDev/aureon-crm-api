spring:
  application.name: spring-postgres-boilerplate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boilerplate}
    username: ${DB_USERNAME:boilerplate}
    password: ${DB_PASSWORD:boilerplate}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  # Uploads larger than this are rejected before they reach FileController (413).
  servlet.multipart:
    max-file-size: ${FILES_MAX_SIZE:10MB}
    max-request-size: ${FILES_MAX_SIZE:10MB}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  info.env.enabled: true
app:
  security.jwt:
    # Override in every real deployment; min 32 bytes for HS256.
    secret: ${JWT_SECRET:development-only-change-this-secret-to-at-least-32-bytes}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  security.refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  files:
    # Relative paths resolve against the working directory (/app in the image).
    storage-dir: ${FILES_DIR:data/files}
    max-size: ${FILES_MAX_SIZE:10MB}
    allowed-types: ${FILES_ALLOWED_TYPES:image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,text/csv}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP:20}
      period: PT1M
    login-failures-per-email:
      capacity: ${RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL:10}
      period: PT15M
    register-per-ip:
      capacity: ${RATE_LIMIT_REGISTER_PER_IP:10}
      period: PT1H
    max-tracked-keys: 100000
  # Optional first admin, created at startup if that account doesn't exist yet.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
server:
  # Behind a proxy (e.g. the Next.js server) take the client IP from X-Forwarded-For, but only
  # when the connection comes from a trusted proxy: by default private and loopback addresses,
  # override with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (a regex). Rate limits key on this IP.
  forward-headers-strategy: native
info.app.name: ${spring.application.name}
info.app.version: ${APP_VERSION:dev}
